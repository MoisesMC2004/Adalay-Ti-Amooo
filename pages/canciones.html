<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regresa cada-Ti amooo! ♡</title>
    <link rel="icon" href="../img/canciones.png" type="image/x-icon">

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/canciones.css">
    <link rel="stylesheet" href="../css/botones.css">

    <!-- Scripts globales comunes -->
    <script src="../js/global.js"></script>
</head>

<body>
    <main class="canciones-container">
        <!-- Título -->
        <h1 class="titulo-principal">Siguiente canción en:</h1>

        <!-- Contador -->
        <div class="contador">
            <div class="tiempo-item">
                <span class="tiempo-valor" id="dias">00</span>
                <span class="tiempo-label">Días</span>
            </div>
            <div class="tiempo-item">
                <span class="tiempo-valor" id="horas">00</span>
                <span class="tiempo-label">Horas</span>
            </div>
            <div class="tiempo-item">
                <span class="tiempo-valor" id="minutos">00</span>
                <span class="tiempo-label">Minutos</span>
            </div>
            <div class="tiempo-item">
                <span class="tiempo-valor" id="segundos">00</span>
                <span class="tiempo-label">Segundos</span>
            </div>
        </div>

        <!-- Contenedores de canciones (Dinámico) -->
        <div class="contenedor-canciones" id="contenedor-canciones">
            <!-- Se cargará dinámicamente mediante JS -->
        </div>

        <!-- Botones de navegación -->
        <div class="wrapper">
            <button class="buttonn">
                <a href="flores.html">ATRÁS!</a>
            </button>
            <button class="buttonn">
                <a href="../index.html">INICIO</a>
            </button>
        </div>
    </main>

    <!-- Modal del Historial -->
    <div id="modal-historial" class="modal-historial">
        <div class="modal-contenido">
            <button class="modal-cerrar" id="close-historial" aria-label="Cerrar historial">&times;</button>
            <h2 class="modal-titulo">NUESTRO HISTORIAL ♡</h2>
            <div class="modal-lista" id="historial-lista">
                <!-- Se cargará dinámicamente mediante JS -->
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="../js/canciones.js"></script>
</body>

</html>

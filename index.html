<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Adalay</title>
    <link rel="icon" href="img/corazon.png" type="image/x-icon">
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/popups.css">
</head>
<body>
    <main class="inicio">
        <!-- Nombre animado -->
        <div class="greetings">
            <span>A</span>
            <span>D</span>
            <span>A</span>
            <span>L</span>
            <span>A</span>
            <span>Y</span>
        </div>
        
        <!-- Subtítulo con efecto typewriter -->
        <div class="greetings2">
            <span id="typewriter"></span>
            <span class="cursor">|</span>
        </div>
        
        <!-- Botón interactivo -->
        <div class="wrapper">
            <button id="btn-click" type="button" aria-haspopup="dialog" aria-controls="popup-overlay">
                CLICK!
            </button>
        </div>
    </main>

    <!-- Modal interactivo con los 4 recados -->
    <div id="popup-overlay" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popup-badge">
        <div class="popup-card">
            <button id="popup-close" class="popup-close" aria-label="Cerrar modal">✕</button>
            <div class="popup-header">
                <span id="popup-badge" class="popup-badge">Recado 1 de 4</span>
                <div id="popup-dots" class="popup-dots"></div>
            </div>
            <div class="popup-body">
                <div id="popup-message-container" class="popup-message"></div>
            </div>
            <div class="popup-actions">
                <button id="popup-btn-prev" type="button" class="btn-popup-prev hidden">Atrás</button>
                <button id="popup-btn-next" type="button" class="btn-popup-next">Siguiente ♡</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/global.js"></script>
    <script src="js/typewriter-inicio.js"></script>
    <script src="js/popups.js"></script>
</body>
</html>
